<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Design</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            padding:10px;
            background:#ffffff;
            font-family:Georgia, serif;
        }

        header,
        nav,
        aside,
        section,
        footer{
            background:#d9dee3;
            border:5px solid #f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        header{
            height:100px;
            margin-bottom:10px;
        }

        nav{
            height:70px;
            margin-bottom:10px;
        }

        main{
            display:grid;
            grid-template-columns: 1fr 3fr 1fr;
            gap:10px;
            margin-bottom:10px;
        }

        aside{
            height:420px;
        }

        section{
            height:420px;
        }

        footer{
            height:80px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Header</h2>
    </header>

    <nav>
        <h2>Navigation Menu</h2>
    </nav>

    <main>

        <aside>
            <h2>Content</h2>
        </aside>

        <section>
            <h2>Main Content</h2>
        </section>

        <aside>
            <h2>Content</h2>
        </aside>

    </main>

    <footer>
        <h2>Footer</h2>
    </footer>

</body>
</html>
